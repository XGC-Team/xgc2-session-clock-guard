name: session-clock-guard-ci

on:
  push:
    branches:
      - noetic
  pull_request:
    branches:
      - noetic
  workflow_dispatch:
    inputs:
      expected_version:
        required: true
        type: string
      expected_source_sha:
        required: true
        type: string
      prepare_action:
        required: false
        default: release
        type: choice
        options:
          - release
          - compatibility-verify
      apt_overlay_url:
        required: false
        default: ""
        type: string
      dependency_set_digest:
        required: false
        default: ""
        type: string
      run_cpp_quality:
        required: true
        default: false
        type: boolean
      run_source_tests:
        required: true
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  XGC2_APT_OVERLAY_URL: ${{ inputs.apt_overlay_url }}
  XGC2_DEPENDENCY_SET_DIGEST: ${{ inputs.dependency_set_digest }}

jobs:
  focal-noetic:
    name: focal-noetic-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate release-train inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          PREPARE_ACTION: ${{ inputs.prepare_action }}
        run: |
          case "$PREPARE_ACTION" in
            release|compatibility-verify) ;;
            *) echo "unsupported prepare_action: $PREPARE_ACTION" >&2; exit 1 ;;
          esac
          [[ "$EXPECTED_SOURCE_SHA" == "$GITHUB_SHA" ]] || {
            echo "HEAD $GITHUB_SHA != expected_source_sha $EXPECTED_SOURCE_SHA" >&2
            exit 1
          }
          product_version="$(awk -F': *' '/^version:/ {print $2; exit}' .xgc2/product.yml)"
          [[ "$product_version" == "$EXPECTED_VERSION" ]] || {
            echo "product version $product_version != expected_version $EXPECTED_VERSION" >&2
            exit 1
          }
          [[ -z "$XGC2_DEPENDENCY_SET_DIGEST" || "$XGC2_DEPENDENCY_SET_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          if [[ -n "$XGC2_APT_OVERLAY_URL" ]]; then
            .xgc2/scripts/configure_xgc2_apt.sh --validate-url "$XGC2_APT_OVERLAY_URL"
          fi
          printf 'quality=%s source-tests=%s\n' '${{ inputs.run_cpp_quality }}' '${{ inputs.run_source_tests }}'

      - name: Build, test, package, and install-check
        run: |
          .xgc2/scripts/build_debs_in_docker.sh \
            --work-dir "$RUNNER_TEMP/xgc2-session-clock-guard-${{ matrix.arch }}" \
            --output-dir "$GITHUB_WORKSPACE/debs"

      - name: Create trusted build manifest
        run: |
          product_version="$(awk -F': *' '/^version:/ {print $2; exit}' .xgc2/product.yml)"
          python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir debs \
            --output-dir .ci/build-manifests \
            --product xgc2-session-clock-guard \
            --expected-package ros-noetic-xgc2-session-clock-guard \
            --product-version "$product_version" \
            --distribution focal \
            --architecture "${{ matrix.arch }}" \
            --source-sha "$GITHUB_SHA" \
            --ci-run-id "$GITHUB_RUN_ID" \
            --ci-workflow "$GITHUB_WORKFLOW" \
            --ci-workflow-ref "$GITHUB_WORKFLOW_REF"

      - name: Upload trusted build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-session-clock-guard-debs-${{ matrix.arch }}
          path: |
            debs/*.deb
            .ci/build-manifests/*.json
          retention-days: 14
          include-hidden-files: true
