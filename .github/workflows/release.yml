name: release

# Product workflows build trusted artifacts only. Central xgc2-devops owns all
# APT repository staging, approval, publication, and rollback.
on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Expected .xgc2/product.yml version
        required: true
        type: string
      expected_source_sha:
        description: Expected immutable source commit SHA
        required: true
        type: string
      prepare_action:
        description: Release-train action
        required: false
        default: release
        type: choice
        options: [release, compatibility-verify]
      apt_overlay_url:
        description: Optional release-scoped staging APT base URL
        required: false
        default: ""
        type: string
      dependency_set_digest:
        description: SHA256 of the resolved release-train dependency set
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

env:
  XGC2_APT_OVERLAY_URL: ${{ inputs.apt_overlay_url }}
  XGC2_DEPENDENCY_SET_DIGEST: ${{ inputs.dependency_set_digest }}

jobs:
  prepare-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate release-train inputs
        env:
          APT_OVERLAY_URL: ${{ inputs.apt_overlay_url }}
          DEPENDENCY_SET_DIGEST: ${{ inputs.dependency_set_digest }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          PREPARE_ACTION: ${{ inputs.prepare_action }}
        run: |
          set -euo pipefail
          case "$PREPARE_ACTION" in
            release|compatibility-verify) ;;
            *) echo "unsupported prepare_action: $PREPARE_ACTION" >&2; exit 1 ;;
          esac
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "expected_source_sha must be a 40-character lowercase Git SHA" >&2
            exit 1
          }
          [[ -z "$DEPENDENCY_SET_DIGEST" || \
            "$DEPENDENCY_SET_DIGEST" =~ ^[0-9a-f]{64}$ ]] || {
            echo "dependency_set_digest must be empty or 64 lowercase hex characters" >&2
            exit 1
          }
          safe_https_url='^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[A-Za-z0-9._~%+:/=-]*)?$'
          if [[ -n "$APT_OVERLAY_URL" && \
            ( "$APT_OVERLAY_URL" =~ [[:space:][:cntrl:]] || \
            ! "$APT_OVERLAY_URL" =~ $safe_https_url ) ]]; then
            echo "apt_overlay_url must be a strict HTTPS URL" >&2
            exit 1
          fi
          if [[ -n "$APT_OVERLAY_URL" && \
            ! "$DEPENDENCY_SET_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "apt_overlay_url requires dependency_set_digest" >&2
            exit 1
          fi
          if [[ "$PREPARE_ACTION" == compatibility-verify && \
            -z "$APT_OVERLAY_URL" ]]; then
            echo "compatibility-verify requires apt_overlay_url" >&2
            exit 1
          fi

  release-guard:
    needs: prepare-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate immutable release identity
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/noetic
          product_version="$(awk -F': *' '/^version:/ {print $2; exit}' .xgc2/product.yml)"
          test "$product_version" = "$EXPECTED_VERSION"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

  compliance:
    needs: release-guard
    runs-on: ubuntu-24.04
    container: ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-dev:1.0.0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run release compliance
        run: |
          set -euo pipefail
          git diff --check HEAD
          .xgc2/scripts/check_package_compliance.sh

  build:
    name: package-tests-debs-${{ matrix.arch }}
    needs: release-guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build, test, package, install, and inspect
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          PREPARE_ACTION: ${{ inputs.prepare_action }}
        run: |
          set -euo pipefail
          install -d .ci/build-manifests
          .xgc2/scripts/build_debs_in_docker.sh \
            --work-dir "$RUNNER_TEMP/xgc2-session-clock-guard-release-${{ matrix.arch }}" \
            --output-dir "$GITHUB_WORKSPACE/debs"
      - name: Create and verify release-train build manifest
        run: |
          set -euo pipefail
          python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir debs \
            --output-dir .ci/build-manifests \
            --product xgc2-session-clock-guard \
            --expected-package ros-noetic-xgc2-session-clock-guard \
            --product-version "${{ inputs.expected_version }}" \
            --distribution focal \
            --architecture "${{ matrix.arch }}" \
            --source-sha "${{ inputs.expected_source_sha }}" \
            --ci-run-id "$GITHUB_RUN_ID" \
            --ci-workflow "$GITHUB_WORKFLOW" \
            --ci-workflow-ref "$GITHUB_WORKFLOW_REF"
          python3 .xgc2/scripts/xgc2_artifact_manifest.py verify-build \
            --artifact-dir . \
            --deb-output-dir .ci/verified-debs \
            --manifest-output-dir .ci/verified-manifests \
            --product xgc2-session-clock-guard \
            --expected-package ros-noetic-xgc2-session-clock-guard \
            --product-version "${{ inputs.expected_version }}" \
            --distribution focal \
            --architecture "${{ matrix.arch }}" \
            --source-sha "${{ inputs.expected_source_sha }}" \
            --ci-run-id "$GITHUB_RUN_ID"
      - name: Upload trusted build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xgc2-session-clock-guard-focal-${{ matrix.arch }}
          path: |
            debs/*.deb
            .ci/build-manifests/*.json
          retention-days: 14
          include-hidden-files: true
