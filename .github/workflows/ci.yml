name: ci

on:
  push:
    branches:
      - noetic
  pull_request:
    branches:
      - noetic
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  focal-noetic:
    name: focal-noetic-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build, test, package, and install-check
        run: |
          .xgc2/scripts/build_debs_in_docker.sh \
            --work-dir "$RUNNER_TEMP/xgc2-session-clock-guard-${{ matrix.arch }}" \
            --output-dir "$GITHUB_WORKSPACE/debs"

      - name: Create trusted build manifest
        run: |
          .xgc2/scripts/create_build_manifest.py \
            --deb-dir debs \
            --output ".ci/xgc2-session-clock-guard_focal_${{ matrix.arch }}.build.json" \
            --architecture "${{ matrix.arch }}" \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --workflow-ref "$GITHUB_WORKFLOW_REF"

      - name: Upload package and manifest
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-session-clock-guard-focal-${{ matrix.arch }}
          path: |
            debs/*.deb
            .ci/*.json
          retention-days: 14
          include-hidden-files: true
